<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus RPG - Database & Guides</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #040915;
      color: #7ab0d0;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    h1 {
      color: #00e5ff;
      text-shadow: 0 0 10px #00e5ff;
    }
    p {
      font-size: 1.2rem;
      max-width: 600px;
      line-height: 1.5;
    }
    .back-btn {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: transparent;
      border: 1px solid #00e5ff;
      color: #00e5ff;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 5px;
      transition: all 0.3s ease;
    }
    .back-btn:hover {
      background-color: #00e5ff;
      color: #040915;
    }
  </style>
</head>
<body>
  <h1>DATABASE & GUIDES</h1>
  <p>SYSTEM ONLINE. Archival data is currently being decrypted. Full library modules will be available in a future update.</p>
  <p>Please return to the main base to continue your mission.</p>
  <button class="back-btn" onclick="window.close()">CLOSE MODULE</button>
</body>
</html>
